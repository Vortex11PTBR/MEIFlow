name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake?schema=public"
          DIRECT_URL: "postgresql://fake:fake@localhost:5432/fake?schema=public"
          ANTHROPIC_API_KEY: ""
          RESEND_API_KEY: ""
          CRON_SECRET: "ci-secret"
