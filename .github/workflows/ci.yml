name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint · Type-check · Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Lint
        run: npm run lint --if-present

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npm test
        env:
          ANTHROPIC_API_KEY: ""

  build:
    name: Build (Next.js)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Build
        run: npx next build
        env:
          DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake?schema=public"
          DIRECT_URL: "postgresql://fake:fake@localhost:5432/fake?schema=public"
          ANTHROPIC_API_KEY: ""
          RESEND_API_KEY: ""
          NEXTAUTH_SECRET: "ci-secret"
          NEXTAUTH_URL: "http://localhost:3000"
          CRON_SECRET: "ci-secret"
